spring.application.name=erp-backend

# No passwords or secrets live in this file or anywhere in the code. They MUST come from the environment
# (the server's .env / compose file, or `export` in your terminal for local runs); if one is missing the
# application refuses to start instead of falling back to a known default.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/stockale}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# Small pool: Neon (and Render's free tier) have limited connections, and idle ones are released so the
# database can go to sleep when nobody is using the app.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=30000

# Render tells the app which port to listen on through PORT.
server.port=${PORT:8080}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

erp.jwt.secret=${JWT_SECRET}
erp.jwt.access-token-minutes=60
erp.jwt.refresh-token-days=7

erp.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# One-time key that unlocks POST /api/auth/bootstrap-admin (creating the very first Super Admin from Postman).
# Empty = that endpoint is switched off. Set it, create the admin, then remove it again.
erp.setup-key=${ERP_SETUP_KEY:}

management.endpoints.web.exposure.include=health,info

# Uploads (spreadsheet imports)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
